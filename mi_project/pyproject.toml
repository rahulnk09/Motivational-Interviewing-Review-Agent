[project]
name = "mi-review"
version = "0.1.0"
description = "MI Review Coach: Motivational Interviewing session review with Azure Content Understanding and LLM agents"
requires-python = ">=3.13"
dependencies = [
    "azure-ai-contentunderstanding>=1.1.0",
    "azure-identity>=1.26.0",
    "jiwer>=4.0.0",
    "langgraph>=1.2.19",
    "openai>=3.35.1",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "requests>=2.32",
    "scikit-learn>=1.9.1",
    "streamlit>=1.66.1",
]

[project.scripts]
mi-review = "mi_review.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mi_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
