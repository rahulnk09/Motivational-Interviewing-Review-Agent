[project]
name = "adi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "azure-ai-contentunderstanding>=1.1.0",
    "azure-identity>=1.26.0",
    "azure-search-documents>=12.0.0",
    "langchain-text-splitters>=1.1.3",
    "mi-review",
    "openai>=3.35.1",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]

[tool.uv.workspace]
members = ["mi_project"]

[tool.uv.sources]
mi-review = { workspace = true }
